name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    name: host + client checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Host tests
        run: npm test
      - name: Client render checks
        run: npm run test:client